<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    font-family: Georgia, "Times New Roman", serif;
    background: #f6fbf2; color: #182415; text-align: center; padding: 2rem;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #120b1e; color: #f0e9fb; }
  }
  h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
  p { opacity: 0.75; margin: 0; line-height: 1.5; }
  .mark { font-size: 2.4rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<div>
  <div class="mark">YB</div>
  <h1>You&rsquo;re offline</h1>
  <p>The shelf needs a connection.<br>We&rsquo;ll be right here when you&rsquo;re back.</p>
</div>
</body>
</html>
